[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdc-operator-kit"
version = "0.1.0a5"
description = "Local desktop and terminal adapters for authorized agents using Remote Desktop Commander"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Setukou"}]
dependencies = []

[project.optional-dependencies]
terminal = ["smartcli-toolkit==0.3.5"]
mcp = ["mcp==2.3.0"]

[project.scripts]
rdc-kit = "rdc_operator.cli:main"
rdc-kit-mcp = "rdc_operator.mcp_server:main"

[tool.setuptools.packages.find]
include = ["rdc_operator*"]
